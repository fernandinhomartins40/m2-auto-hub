name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VPS_HOST: 72.60.10.112
  VPS_USER: root
  APP_DIR: /opt/m2centerauto

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment:
      name: production
      url: https://www.m2centerauto.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Setup SSH
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$VPS_PASSWORD" > "$HOME/.ssh/vps_password"
          chmod 600 "$HOME/.ssh/vps_password"
          cat > "$HOME/.ssh/config" <<EOF
          Host vps
            HostName ${{ env.VPS_HOST }}
            User ${{ env.VPS_USER }}
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 40
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Sync code to VPS
        run: |
          sshpass -f "$HOME/.ssh/vps_password" ssh -F "$HOME/.ssh/config" vps \
            "mkdir -p ${{ env.APP_DIR }}"

          sshpass -f "$HOME/.ssh/vps_password" rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='apps/backend/node_modules' \
            --exclude='apps/frontend/node_modules' \
            --exclude='apps/backend/dist' \
            --exclude='apps/frontend/dist' \
            --exclude='apps/backend/uploads' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='coverage' \
            -e "ssh -F $HOME/.ssh/config" \
            ./ "${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/"

      - name: Prepare .env on VPS
        run: |
          sshpass -f "$HOME/.ssh/vps_password" ssh -F "$HOME/.ssh/config" vps \
            "bash $APP_DIR/scripts/prepare-env.sh"

      - name: Bootstrap VPS runtime
        run: |
          sshpass -f "$HOME/.ssh/vps_password" ssh -F "$HOME/.ssh/config" vps \
            "bash $APP_DIR/scripts/bootstrap-runtime.sh"

      - name: Deploy on VPS
        run: |
          sshpass -f "$HOME/.ssh/vps_password" ssh -F "$HOME/.ssh/config" vps \
            "bash $APP_DIR/deploy-vps.sh"

      - name: Configure Nginx
        run: |
          sshpass -f "$HOME/.ssh/vps_password" ssh -F "$HOME/.ssh/config" vps \
            "bash $APP_DIR/scripts/configure-nginx.sh"

      - name: Verify deployment
        run: |
          sshpass -f "$HOME/.ssh/vps_password" ssh -F "$HOME/.ssh/config" vps \
            "curl -fsS http://localhost:7001/health && echo 'Deploy OK'"

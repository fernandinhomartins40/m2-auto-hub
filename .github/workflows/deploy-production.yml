name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/m2centerauto
  DEPLOY_PORT: "3092"
  PRIMARY_DOMAIN: m2centerauto.com.br
  SECONDARY_DOMAIN: www.m2centerauto.com.br
  CANONICAL_URL: https://www.m2centerauto.com.br
  SSL_EMAIL: admin@m2centerauto.com.br

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          target: production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          build-args: RELEASE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api
            RELEASE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-alpr:
    name: Build ALPR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ALPR
        uses: docker/build-push-action@v6
        with:
          context: services/alpr-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-alpr:${{ github.sha }}
          cache-from: type=gha,scope=alpr
          cache-to: type=gha,mode=max,scope=alpr

  build-plate-scraper:
    name: Build plate scraper image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish plate scraper
        uses: docker/build-push-action@v6
        with:
          context: services/plate-scraper
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-plate-scraper:${{ github.sha }}
          cache-from: type=gha,scope=plate-scraper
          cache-to: type=gha,mode=max,scope=plate-scraper

  deploy:
    name: Deploy prebuilt images to VPS
    needs: [build-backend, build-frontend, build-alpr, build-plate-scraper]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.m2centerauto.com.br
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        shell: bash
        run: echo "version=${GITHUB_SHA::12}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload deployment manifests
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        shell: bash
        run: |
          RELEASE_DIR="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p '$RELEASE_DIR/scripts'"
          tar -czf - docker-compose.production.yml deploy-vps.sh scripts/bootstrap-runtime.sh scripts/prepare-env.sh scripts/configure-nginx.sh \
            | sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "tar -xzf - -C '$RELEASE_DIR'"

      - name: Prepare VPS runtime
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/scripts/bootstrap-runtime.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "bash $SCRIPT"

      - name: Ensure .env exists on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/scripts/prepare-env.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "export APP_ROOT=${{ env.APP_ROOT }} DEPLOY_PORT=${{ env.DEPLOY_PORT }} PRIMARY_DOMAIN=${{ env.PRIMARY_DOMAIN }} SECONDARY_DOMAIN=${{ env.SECONDARY_DOMAIN }} CANONICAL_URL=${{ env.CANONICAL_URL }}; bash $SCRIPT"

      - name: Authenticate VPS to GitHub Container Registry
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

      - name: Deploy on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/deploy-vps.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "export APP_ROOT=${{ env.APP_ROOT }} RELEASE=${{ steps.release.outputs.version }} DEPLOY_PORT=${{ env.DEPLOY_PORT }} IMAGE_TAG=${{ github.sha }} IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}; bash $SCRIPT"

      - name: Configure Nginx
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/scripts/configure-nginx.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "export DEPLOY_PORT=${{ env.DEPLOY_PORT }} PRIMARY_DOMAIN=${{ env.PRIMARY_DOMAIN }} SECONDARY_DOMAIN=${{ env.SECONDARY_DOMAIN }} CANONICAL_URL=${{ env.CANONICAL_URL }} SSL_EMAIL=${{ env.SSL_EMAIL }}; bash $SCRIPT"

      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "test \"\$(curl -fsS http://localhost:${{ env.DEPLOY_PORT }}/.release-version)\" = '${{ github.sha }}' && curl -fsS http://localhost:${{ env.DEPLOY_PORT }}/health && echo 'Deploy OK: ${{ github.sha }}'"

      - name: Verify public release
        shell: bash
        run: |
          for attempt in {1..12}; do
            deployed="$(curl -fsS -H 'Cache-Control: no-cache' '${{ env.CANONICAL_URL }}/.release-version?run=${{ github.run_id }}' || true)"
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "Public release confirmed: $deployed"
              exit 0
            fi
            echo "Attempt $attempt/12: expected ${{ github.sha }}, received ${deployed:-empty}"
            sleep 5
          done
          echo "Public domain did not publish the expected frontend image" >&2
          exit 1

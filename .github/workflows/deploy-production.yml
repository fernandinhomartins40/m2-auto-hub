name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VPS: root@72.60.10.112
  APP_DIR: /opt/m2centerauto
  SSH: sshpass -f ~/.ssh/vps_password ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: production
      url: https://www.m2centerauto.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Setup SSH password file
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$VPS_PASSWORD" > ~/.ssh/vps_password
          chmod 600 ~/.ssh/vps_password

      - name: Sync code to VPS
        run: |
          ${{ env.SSH }} ${{ env.VPS }} "mkdir -p ${{ env.APP_DIR }}"

          sshpass -f ~/.ssh/vps_password rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='apps/backend/node_modules' \
            --exclude='apps/frontend/node_modules' \
            --exclude='apps/backend/dist' \
            --exclude='apps/frontend/dist' \
            --exclude='apps/backend/uploads' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='coverage' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ env.VPS }}:${{ env.APP_DIR }}/

      - name: Prepare .env on VPS
        run: |
          ${{ env.SSH }} ${{ env.VPS }} "bash ${{ env.APP_DIR }}/scripts/prepare-env.sh"

      - name: Bootstrap VPS runtime
        run: |
          ${{ env.SSH }} ${{ env.VPS }} "bash ${{ env.APP_DIR }}/scripts/bootstrap-runtime.sh"

      - name: Deploy on VPS
        run: |
          sshpass -f ~/.ssh/vps_password ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            ${{ env.VPS }} "bash ${{ env.APP_DIR }}/deploy-vps.sh"

      - name: Configure Nginx
        run: |
          ${{ env.SSH }} ${{ env.VPS }} "bash ${{ env.APP_DIR }}/scripts/configure-nginx.sh"

      - name: Verify deployment
        run: |
          ${{ env.SSH }} ${{ env.VPS }} "curl -fsS http://localhost:7001/health && echo 'Deploy OK'"

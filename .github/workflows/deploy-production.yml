name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/m2centerauto
  DEPLOY_PORT: "3092"
  PRIMARY_DOMAIN: m2centerauto.com.br
  SECONDARY_DOMAIN: www.m2centerauto.com.br
  CANONICAL_URL: https://www.m2centerauto.com.br
  SSL_EMAIL: admin@m2centerauto.com.br

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment:
      name: production
      url: https://www.m2centerauto.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        run: echo "version=$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Upload source to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_DIR="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p '$RELEASE_DIR'"

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.turbo \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=apps/backend/node_modules \
            --exclude=apps/frontend/node_modules \
            --exclude=apps/backend/dist \
            --exclude=apps/frontend/dist \
            --exclude=apps/backend/uploads \
            --exclude=coverage \
            `# PLANO ITEM 8: apps/mobile tem 1,3 GB de artefatos de build e nao` \
            `# e servido pela VPS - o app e distribuido pelas lojas. Com o` \
            `# runner hospedado pelo GitHub o checkout e limpo e o diretorio nem` \
            `# existia; num self-hosted runner o _work persiste entre execucoes,` \
            `# e sem esta linha o tar passaria a enviar tudo isso a cada deploy.` \
            --exclude=apps/mobile \
            -czf - . \
          | sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
              "tar -xzf - -C '$RELEASE_DIR'"

      - name: Prepare VPS runtime
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/scripts/bootstrap-runtime.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "bash $SCRIPT"

      - name: Ensure .env exists on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/scripts/prepare-env.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "export APP_ROOT=${{ env.APP_ROOT }} DEPLOY_PORT=${{ env.DEPLOY_PORT }} PRIMARY_DOMAIN=${{ env.PRIMARY_DOMAIN }} SECONDARY_DOMAIN=${{ env.SECONDARY_DOMAIN }} CANONICAL_URL=${{ env.CANONICAL_URL }}; bash $SCRIPT"

      - name: Deploy on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/deploy-vps.sh"
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "export APP_ROOT=${{ env.APP_ROOT }} RELEASE=${{ steps.release.outputs.version }} DEPLOY_PORT=${{ env.DEPLOY_PORT }}; bash $SCRIPT"

      - name: Configure Nginx
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          SCRIPT="${{ env.APP_ROOT }}/releases/${{ steps.release.outputs.version }}/scripts/configure-nginx.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "export DEPLOY_PORT=${{ env.DEPLOY_PORT }} PRIMARY_DOMAIN=${{ env.PRIMARY_DOMAIN }} SECONDARY_DOMAIN=${{ env.SECONDARY_DOMAIN }} CANONICAL_URL=${{ env.CANONICAL_URL }} SSL_EMAIL=${{ env.SSL_EMAIL }}; bash $SCRIPT"

      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "curl -fsS http://localhost:${{ env.DEPLOY_PORT }}/health && echo 'Deploy OK'"

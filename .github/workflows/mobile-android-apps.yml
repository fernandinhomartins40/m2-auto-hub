name: Mobile Android (Cliente e Mecânico)

# Valida os apps nativos a cada mudança e gera o AAB da Play Store sob demanda.
# O app admin (apps/mobile) continua em mobile-build.yml.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile_cliente/**"
      - "apps/mobile_mecanico/**"
      - "packages/mobile_core/**"
      - ".github/workflows/mobile-android-apps.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "App para gerar o AAB"
        required: true
        type: choice
        options: [cliente, mecanico]
      api_base_url:
        description: "URL base da API embutida no build"
        required: true
        default: "https://m2centerauto.com.br/api"

env:
  FLUTTER_VERSION: "3.32.8"

jobs:
  validate:
    name: Analisar e testar (${{ matrix.package }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/mobile_core
          - apps/mobile_cliente
          - apps/mobile_mecanico
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  bundle:
    name: AAB ${{ inputs.app }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # A keystore não fica no git. Sem assinatura a Play recusa o envio, então
      # a falta dos secrets interrompe o build em vez de gerar um AAB inútil.
      - name: Restaurar keystore de upload
        env:
          KEYSTORE_BASE64: ${{ inputs.app == 'cliente' && secrets.ANDROID_CLIENTE_KEYSTORE_BASE64 || secrets.ANDROID_MECANICO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ inputs.app == 'cliente' && secrets.ANDROID_CLIENTE_KEYSTORE_PASSWORD || secrets.ANDROID_MECANICO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os secrets da keystore de ${{ inputs.app }}. Veja docs/APPS-ANDROID.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Gerar AAB
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: m2-${{ inputs.app }}-aab
          path: apps/mobile_${{ inputs.app }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

# Nginx unico do stack: serve os estaticos do SPA E faz o proxy para o backend.
#
# Antes havia dois nginx: este (so estaticos, porta 3000) e um "gateway" que
# recebia a porta publica e repassava tudo para ca. Era um container inteiro e
# um salto de rede por request para cumprir o papel que um unico nginx faz.
# Servir estatico continua sendo trabalho do nginx, nao do Node - o que mudou
# foi so juntar as duas camadas de nginx em uma.
server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker. Com o nome do backend numa variavel, o nginx resolve
  # o endereco a cada request em vez de exigir que ele exista no momento do
  # start: se o backend for reiniciado ou ainda nao tiver subido, o nginx
  # continua de pe e serve o SPA, em vez de morrer com "host not found in
  # upstream".
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend_host backend;

  # Redirects relativos: este nginx roda atras do nginx da VPS, que termina o
  # SSL. Um redirect absoluto vazaria o host/porta internos ("http://127.0.0.1/")
  # em vez de manter o dominio publico.
  absolute_redirect off;
  port_in_redirect off;

  # Compressao dos textos servidos daqui. O ganho e de banda e de tempo de
  # carregamento; o custo de CPU e desprezivel nos niveis baixos.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location = /api {
    return 301 /api/;
  }

  location ^~ /api/ {
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://$backend_host:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # Sem URI no final do proxy_pass: o path chega ao backend inteiro
  # (/uploads/foto.jpg). Com "/uploads/" no final, o nginx trocaria a parte
  # casada e o nome do arquivo se perderia.
  location ^~ /uploads/ {
    proxy_pass http://$backend_host:3001$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # Assets com hash no nome: podem ser cacheados para sempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

<!doctype html>

    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Escolhe o manifest do PWA (cliente/admin/mecânico) ANTES de o navegador
      resolver o <link rel="manifest">. Fazer isso no <head>, de forma síncrona,
      evita o bug em que o Android lê o manifest do cliente antes do JS trocar e,
      por isso, instala o PWA do cliente mesmo na tela do admin.
    -->
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        var app = "customer";

        if (
          path.indexOf("/admin-login") === 0 ||
          path.indexOf("/store-panel") === 0 ||
          path.indexOf("/admin") === 0 ||
          path.indexOf("/pwa-admin") === 0 ||
          path.indexOf("/pwa-entry") === 0
        ) {
          app = "admin";
        }
        if (path.indexOf("/mechanic-panel") === 0 || search.indexOf("source=pwa-mechanic") !== -1) {
          app = "mechanic";
        }
        if (path.indexOf("/pwa-entry") === 0 && search.indexOf("app=mechanic") !== -1) {
          app = "mechanic";
        }

        function addLink(rel, href, attrs) {
          var el = document.createElement("link");
          el.setAttribute("rel", rel);
          el.setAttribute("href", href);
          if (attrs) {
            Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
          }
          document.head.appendChild(el);
        }

        addLink("manifest", "/api/settings/pwa-manifest.webmanifest?app=" + app);
        addLink("apple-touch-icon", "/api/settings/pwa-apple-touch-icon.png?app=" + app);
      })();
    </script>

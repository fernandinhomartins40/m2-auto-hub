# O driver json-file nao tem limite por padrao: o log de um servico em loop
# cresce ate encher o disco da VPS, que e compartilhada. Tres arquivos de 10MB
# por servico dao historico suficiente para diagnostico com teto previsivel.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-build: &backend-build
  context: ./apps/backend
  target: production
  args:
    RELEASE_VERSION: ${RELEASE_VERSION:-local}

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 3001
  # connection_limit: sem ele o Prisma abre num_cpus*2+1 conexoes por instancia,
  # dimensionado pelos cores do HOST. Numa VPS compartilhada isso desperdica
  # processos do Postgres que ficam ociosos.
  DATABASE_URL: "postgresql://${POSTGRES_USER:-m2}:${POSTGRES_PASSWORD:-m2_dev_2026}@postgres:5432/${POSTGRES_DB:-m2_auto_hub}?schema=public&connection_limit=10&pool_timeout=20"
  JWT_SECRET: ${JWT_SECRET:-replace_me_with_at_least_32_chars_1234567890}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Test123!}
  CORS_ORIGIN: "${CORS_ORIGIN:-https://www.m2centerauto.com.br,https://m2centerauto.com.br}"
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  ALPR_SERVICE_URL: http://alpr:8000
  PLATE_SCRAPER_URL: http://plate-scraper:8100
  PLATE_SCRAPER_ENABLED: ${PLATE_SCRAPER_ENABLED:-true}
  # Consulta de placa: sem os tokens, usa apenas a base propria de placas.
  PLATE_LOOKUP_API_URL: ${PLATE_LOOKUP_API_URL:-https://gateway.apibrasil.io/api/v2/vehicles}
  PLATE_LOOKUP_BEARER_TOKEN: ${PLATE_LOOKUP_BEARER_TOKEN:-}
  PLATE_LOOKUP_DEVICE_TOKEN: ${PLATE_LOOKUP_DEVICE_TOKEN:-}
  PLATE_LOOKUP_TIMEOUT_MS: ${PLATE_LOOKUP_TIMEOUT_MS:-8000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # URL publica HTTPS usada para montar redirect/callback de OAuth e webhooks dos marketplaces
  APP_BASE_URL: ${APP_BASE_URL:-https://m2centerauto.com.br}
  # Chave de criptografia (AES-256-GCM) dos segredos de marketplace. Definir um valor forte em producao.
  MARKETPLACE_ENC_KEY: ${MARKETPLACE_ENC_KEY:-}
  MARKETPLACE_JOBS_ENABLED: ${MARKETPLACE_JOBS_ENABLED:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Teto de memoria por servico: sem isso um vazamento aqui consome a RAM da
    # VPS inteira e o kernel mata processos de outros projetos do servidor.
    mem_limit: 768m
    logging: *default-logging
    # Sem estes parametros o Postgres assume que a maquina e toda dele: ele le
    # o total de RAM do host (16 GB), nao o limite do container. Os valores
    # abaixo sao dimensionados para o mem_limit acima, nao para a VPS inteira.
    command:
      - postgres
      # ~25% do limite do container, deixando espaco para o cache do SO.
      - -c
      - shared_buffers=192MB
      # Nao aloca nada: e so uma dica para o planejador saber que ha cache.
      - -c
      - effective_cache_size=512MB
      # Por operacao de ordenacao/hash. Alto demais aqui multiplica por conexao.
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      # Cada conexao e um processo. O backend usa pool proprio (connection_limit
      # na DATABASE_URL), entao nao ha motivo para permitir 100 conexoes.
      - -c
      - max_connections=50
      # Autovacuum nunca deve ser desligado - so contido a um worker.
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=1
      - -c
      - max_parallel_workers_per_gather=0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m2_auto_hub}
      POSTGRES_USER: ${POSTGRES_USER:-m2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m2_dev_2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m2} -d ${POSTGRES_DB:-m2_auto_hub}"]
      # 5s davam 17.280 execucoes por dia para um banco que, uma vez de pe, nao
      # cai sozinho. O start_period cobre a subida; depois disso 30s bastam.
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 6
    volumes:
      - postgres_data:/var/lib/postgresql/data

  alpr:
    image: m2centerauto-alpr:${RELEASE_VERSION:-local}
    build:
      context: ./services/alpr-service
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"
        ]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 6

  # Consulta de placa em navegador real (headful sobre Xvfb). E o fallback do
  # fluxo assistido, quando o navegador do atendente nao resolve.
  plate-scraper:
    image: m2centerauto-plate-scraper:${RELEASE_VERSION:-local}
    build:
      context: ./services/plate-scraper
    restart: unless-stopped
    # O Chrome usa /dev/shm para as texturas das abas; 512m basta para uma aba
    # por vez (o servico serializa as consultas em fila).
    shm_size: 512m
    # Era 2g quando o navegador ficava aberto para sempre. O server.js agora o
    # encerra apos BROWSER_IDLE_MS sem consultas e relanca na proxima, entao o
    # pico so acontece durante a consulta em si.
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 6

  migrator:
    image: m2centerauto-backend:${RELEASE_VERSION:-local}
    # Efemero: roda `prisma migrate deploy` e sai. Sobe junto com o Postgres,
    # entao um teto folgado aqui competiria com o banco no pior momento.
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-env
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  bootstrap:
    image: m2centerauto-backend:${RELEASE_VERSION:-local}
    # Efemero, como o migrator.
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backend-env
    command: ["node", "dist/scripts/bootstrap-production.js"]
    restart: "no"

  backend:
    image: m2centerauto-backend:${RELEASE_VERSION:-local}
    build: *backend-build
    # Um servico que falhou 5 vezes seguidas nao se cura na sexta: com
    # unless-stopped o Docker o relanca para sempre, queimando CPU da VPS
    # inteira sem atender ninguem. Com on-failure:5 ele desiste e fica visivel.
    restart: on-failure:5
    mem_limit: 1g
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      alpr:
        condition: service_healthy
    environment: *backend-env
    command: ["node", "dist/server.js"]
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 6
    volumes:
      - uploads_data:/app/uploads

  frontend:
    image: m2centerauto-frontend:${RELEASE_VERSION:-local}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        RELEASE_VERSION: ${RELEASE_VERSION:-local}
    restart: unless-stopped
    # Nginx servindo arquivos estaticos tem pegada minima; 128m sobra.
    mem_limit: 128m
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    # Este e agora o unico ponto de entrada: o servico "gateway" foi removido
    # porque era um segundo nginx cuja unica funcao era repassar o trafego para
    # este. Menos um container e menos um salto de rede por request.
    ports:
      - "127.0.0.1:${DEPLOY_PORT:-3092}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
    external: true
    name: m2centerauto-postgres-data
  uploads_data:
    external: true
    name: m2centerauto-uploads

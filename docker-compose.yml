services:
  postgres:
    image: postgres:16-alpine
    container_name: m2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m2_auto_hub}
      POSTGRES_USER: ${POSTGRES_USER:-m2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m2_dev_2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m2} -d ${POSTGRES_DB:-m2_auto_hub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  alpr:
    build:
      context: ./services/alpr-service
    container_name: m2-alpr
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Consulta de placa em navegador real (headful sobre Xvfb). E o fallback do
  # fluxo assistido, quando o navegador do atendente nao resolve.
  plate-scraper:
    build:
      context: ./services/plate-scraper
    container_name: m2-plate-scraper
    restart: unless-stopped
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      target: production
    container_name: m2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      alpr:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-m2}:${POSTGRES_PASSWORD:-m2_dev_2026}@postgres:5432/${POSTGRES_DB:-m2_auto_hub}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-m2_auto_hub_jwt_secret_dev_2026_change_in_production_now}
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
      CORS_ORIGIN: "http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080},http://localhost:3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALPR_SERVICE_URL: http://alpr:8000
      PLATE_SCRAPER_URL: http://plate-scraper:8100
      PLATE_SCRAPER_ENABLED: ${PLATE_SCRAPER_ENABLED:-true}
      PLATE_LOOKUP_API_URL: ${PLATE_LOOKUP_API_URL:-https://gateway.apibrasil.io/api/v2/vehicles}
      PLATE_LOOKUP_BEARER_TOKEN: ${PLATE_LOOKUP_BEARER_TOKEN:-}
      PLATE_LOOKUP_DEVICE_TOKEN: ${PLATE_LOOKUP_DEVICE_TOKEN:-}
      PLATE_LOOKUP_TIMEOUT_MS: ${PLATE_LOOKUP_TIMEOUT_MS:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    volumes:
      - ./apps/backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: m2-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    container_name: m2-gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
